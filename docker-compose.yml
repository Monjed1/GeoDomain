services:
  api:
    build: .
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "3232:3232"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
